info:
  name: Change user password
  type: http
  seq: 1
  tags:
    - Authentication

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "temp-9fd7f05c",
        "newPassword": "monMdpSecurise"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Password successfully updated
    request:
      url: "{{baseUrl}}/api/auth/change-password/:username"
      method: PUT
      body:
        type: json
        data: |-
          {
            "idUser": "",
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 400 Response
    description: Invalid request payload
    request:
      url: "{{baseUrl}}/api/auth/change-password/:username"
      method: PUT
      body:
        type: json
        data: |-
          {
            "idUser": "",
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 401 Response
    description: Incorrect current password
    request:
      url: "{{baseUrl}}/api/auth/change-password/:username"
      method: PUT
      body:
        type: json
        data: |-
          {
            "idUser": "",
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 404 Response
    description: User not found
    request:
      url: "{{baseUrl}}/api/auth/change-password/:username"
      method: PUT
      body:
        type: json
        data: |-
          {
            "idUser": "",
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "{}"
  - name: 500 Response
    description: Internal Server Error
    request:
      url: "{{baseUrl}}/api/auth/change-password/:username"
      method: PUT
      body:
        type: json
        data: |-
          {
            "idUser": "",
            "currentPassword": "",
            "newPassword": ""
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: "{}"

docs: Allows an authenticated user to change their password by verifying their current password.
