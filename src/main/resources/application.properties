spring.application.name=hospital

# Database
spring.data.mongodb.uri=mongodb://${DB_USERNAME}:${DB_PWD}@${HOST_IP}:${DB_PORT}/${DB_AUTH_SOURCE}

# File upload size limits for multipart requests
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}

# Secret key for security-related features (JWT, encryption, etc.)
jwt.secret.key=${JWT_SECRET_KEY}
# Duration in seconds
jwt.token.duration=${JWT_TOKEN_DURATION}

# Create a default admin user
app.default.username=${ADMIN_USER}
app.default.password=${ADMIN_PWD}

# Location of files uploaded
file.storage.path=${FILE_PATH}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.web.resources.add-mappings=true